name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskly-backend-express
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: taskly-backend-express/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskly-backend-express
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: taskly-backend-express/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: End-to-end tests
        run: npm run test:e2e

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: taskly-backend-express
          file: taskly-docker/taskly-backend-express/Dockerfile
          load: true
          tags: taskly-backend-express:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        working-directory: taskly-docker
        run: |
          make env
          docker compose -f docker-compose.local.yml up -d --build --wait --wait-timeout 180
      - name: Smoke test the API
        run: |
          curl -fsS http://127.0.0.1:8000/
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","email":"ci_user@mail.com","password":"CiPassword123"}'
      - name: Show logs on failure
        if: failure()
        working-directory: taskly-docker
        run: docker compose -f docker-compose.local.yml logs --no-color
      - name: Stop the stack
        if: always()
        working-directory: taskly-docker
        run: docker compose -f docker-compose.local.yml down -v
