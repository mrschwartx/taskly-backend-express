name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Taskly commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  taskly-quality:
    name: Taskly code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskly-backend
    services:
      mongo:
        image: mongo:8.0
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Testing coverage
        run: npm run test:coverage

  taskly-e2e:
    name: Taskly end-to-end
    runs-on: ubuntu-latest
    needs: taskly-quality
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskly-backend
    services:
      mongo:
        image: mongo:8.0
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run end-to-end tests
        run: npm run test:e2e

  taskly-docker:
    name: Taskly docker container
    runs-on: ubuntu-latest
    needs: taskly-quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: taskly-backend
          file: taskly-docker/taskly-backend/Dockerfile
          load: true
          tags: taskly-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        working-directory: taskly-docker
        run: |
          make docker/env
          docker compose -f docker-compose.local.yml up -d --build --wait --wait-timeout 180
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs taskly-backend
          exit 1
      - name: Check API
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","email":"ci_user@mail.com","password":"CiPassword123"}'
      - name: Show logs on failure
        if: failure()
        working-directory: taskly-docker
        run: docker compose -f docker-compose.local.yml logs --no-color
      - name: Stop stack
        if: always()
        working-directory: taskly-docker
        run: docker compose -f docker-compose.local.yml down -v
